notes          = "Physical device, Hak5 WiFi Pineapple Tetra (MK5.8 hardware, firmware 2.7.0). MAC 00:13:37:A7:A4:C1 is the LAN interface observed on 172.16.42.1 — the Tetra has multiple radios (wlan0/wlan1/wlan2) with distinct MACs, so any single MAC captures only one interface; OUI 00:13:37 (LEET) is a Hak5-assigned vendor block. nmap OS fingerprint is an exact 100% match on OpenWrt 19.07 / Linux 4.14, which is the stock PineAP firmware base. Service-level banners expose OpenSSH 8.0 on :22 and nginx 1.17.7 on :80 (the PineAP management UI) — both give strong application CPEs at version precision. No Hak5-specific NVD CPE entry is known to exist for the Tetra; the hak5:wifi_pineapple_tetra hardware CPE is aspirational / may be absent from NVD, in which case the broader hak5:wifi_pineapple family CPE partial-credits identification. nginx vendor migrated from igor_sysoev to f5 to nginx across NVD revisions — multiple vendor forms accepted."