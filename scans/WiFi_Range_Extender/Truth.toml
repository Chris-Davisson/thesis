notes          = "Whitelabel VxWorks-based WiFi extender sourced from Temu. No NVD CPE exists for Shenzhen Fenvi or for generic wifi repeater/extender products. Device exposes only telnet (port 23, 'Login as:' prompt, no vendor banner) and HTTP (port 80, title 'Wi-Fi Extender', no Server header). mDNS (5353) and SSDP (1900) both closed. Firmware version not recoverable from network interface and not exposed in admin UI. MAC OUI 1C:BF:CE is Shenzhen Century Xinyang Technology — likely the ODM manufacturing for the Fenvi brand, a common Chinese-market arrangement where a single OEM whitelabels across many retail brands. The only CPE-mappable signal is nmap's OS fingerprint (VxWorks, accuracy 100), which is partial credit at best since it identifies the RTOS, not the device. This entry represents a realistic negative-case ground truth: a device where CPE-level identification is genuinely infeasible from network signals alone."