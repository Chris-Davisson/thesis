notes          = "Physical device, ARRIS Touchstone DG6450 DOCSIS 3.0 cable gateway (integrated modem + router + WiFi). Firmware 01.04.086.06.02.NCS is an ARRIS/CommScope release — the .NCS suffix denotes the carrier/ISP branch. MAC 40:2B:50:D8:75:1B OUI is CommScope, which acquired ARRIS in April 2019; NVD CPE entries exist under both 'arris' and 'commscope' vendor forms (older devices typically under arris, post-acquisition firmware sometimes under commscope). Port 443 TLS cert's commonName 0000A0720CB7 is the device's own MAC-derived identifier, and organizationName 'ARRIS Group, Inc.' with issuer 'HWROB Device Sub-CA 9' is strong confirmation of vendor + product family. nmap OS fingerprint 'Linux 3.2 - 4.14' is a wide range (Broadcom-based embedded Linux is typical for this hardware) — no specific kernel version pin possible, so only the unversioned linux_kernel CPE gets partial credit. lighttpd is reported by nmap without a version string, so only the unversioned lighttpd CPE is accepted. The DG6450 hardware CPE may not exist in NVD (CPE entries for ARRIS cable gateways are spotty), so hardware CPE is aspirational; broader product-line match under the 'touchstone' family partial-credits identification."