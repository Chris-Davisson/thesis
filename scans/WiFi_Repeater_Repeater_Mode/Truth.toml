notes          = "Physical device in repeater mode (joined the upstream WiFi as a client and got 192.168.0.172 from the upstream router's DHCP). MAC field is blank because the scan was run from a different L2 segment (upstream side) — nmap could not observe the device's MAC via ARP, only its routed IPv4 address. Telnet banner reports hostname 'Srepeater', confirming this is the same physical hardware as WiFi_Repeater_AP_Mode and WiFi_Repeater_Router_Mode (whose MACs are 26:C9:2B:9E:9D:D6/D7). Open services: 22 (Dropbear SSH), 23 (BusyBox telnetd), 53 (DNS, returns SERVFAIL — Unbound is running but not authoritative in this mode), 80 (lighttpd 1.4.32, no title), 81 (no banner). nmap OS fingerprint exact 100% match on 'OpenWrt Chaos Calmer 15.05 (Linux 3.18) or Designated Driver (Linux 4.1 or 4.4)'. Fields left blank: mac (off-segment), true_vendor, true_product, true_hardware_revision, true_firmware_version (no vendor/product banner exposed)."
