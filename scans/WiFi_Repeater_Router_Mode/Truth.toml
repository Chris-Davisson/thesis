notes          = "Physical device in router mode. Truth.toml originally listed IP 192.168.0.1 — corrected to actual scan IP 192.168.11.1 (default LAN-side IP when the device is acting as a router). Hostname 'Srepeater.lan'. MAC 26:C9:2B:9E:9D:D6 has the locally-administered bit set (second nibble = 6 → U/L bit on); no OUI assignment — the device generates a random MAC. This is the same physical hardware as WiFi_Repeater_AP_Mode (...D7) and WiFi_Repeater_Repeater_Mode, just operating in a different mode; the LAN/WLAN interfaces sit at consecutive MACs (...D6 / ...D7). Open services: 22 (Dropbear SSH), 23 (BusyBox telnetd), 53 (Unbound DNS), 80 (lighttpd 1.4.32, no title), 81 (no banner). nmap OS fingerprint is an exact 100% match on 'OpenWrt Chaos Calmer 15.05 (Linux 3.18) or Designated Driver (Linux 4.1 or 4.4)' — fingerprint cannot disambiguate the two branches. Fields left blank: true_vendor, true_product, true_hardware_revision, true_firmware_version (no vendor/product banner; firmware not exposed; would need physical label or admin-UI login)."
