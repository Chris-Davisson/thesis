notes          = "Physical Sonoff smart plug. MAC OUI 40:22:D8 is Espressif (confirms ESP8266/ESP32 SoC, standard for Sonoff/iTead products). Specific model not identified — no UPnP (port 1900 closed), no mDNS response (port 5353 open|filtered, no service announce), no HTTP banner. Only TCP port 8081 open, which is the eWeLink LAN-mode control protocol used by ITEAD/Sonoff devices. nmap OS fingerprint matches lwIP 1.4.1-2.0.3 (99%) with the third-best match being 'Shelly home automation device' (91%) — consistent with an ESP-based smart-home device. No NVD CPE exists for Sonoff/iTead consumer smart plugs. Fields left blank: true_product (need physical label), true_hardware_revision, true_firmware_version (eWeLink protocol does not expose firmware over the network without authentication)."
