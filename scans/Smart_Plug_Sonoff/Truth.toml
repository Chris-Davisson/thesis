    {cpe = "cpe:2.3:o:itead:ewelink_firmware:*:*:*:*:*:*:*:*", tier = "partial"},
    {cpe = "cpe:2.3:o:tasmota:tasmota:*:*:*:*:*:*:*:*", tier = "partial"},
