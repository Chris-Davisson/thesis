notes          = "Physical device in AP (access point) mode. Truth.toml originally listed IP 192.168.0.1 — corrected to actual scan IP 192.168.11.1 (the device's LAN-side IP in AP mode). Hostname 'Srepeater.lan' (Smart Repeater). MAC 26:C9:2B:9E:9D:D7 has the locally-administered bit set (second nibble = 6 → 0010, U/L bit on), so the OUI is not registered to any vendor — the device generates a random MAC, common in cheap Chinese OpenWrt-based repeaters. Same physical hardware as WiFi_Repeater_Router_Mode (MAC differs by 1: ...D6 vs ...D7, the distinct LAN/WLAN interface) and WiFi_Repeater_Repeater_Mode. Open services: 22 (Dropbear SSH), 23 (BusyBox telnetd), 53 (Unbound DNS), 80 (lighttpd 1.4.32, no page title), 81 (no banner). nmap OS fingerprint is an exact 100% match on 'OpenWrt Chaos Calmer 15.05 (Linux 3.18) or Designated Driver (Linux 4.1 or 4.4)' — both branches share a fingerprint, so the kernel version cannot be pinned. lighttpd 1.4.32 (Sept 2013 release) gives an exact version-pinned application CPE. Fields left blank: true_vendor, true_product, true_hardware_revision, true_firmware_version (the device exposes no vendor/product banner; firmware version not in HTTP headers or admin UI title; would need the physical label or admin-UI login)."
